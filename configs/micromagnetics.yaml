# ---------------------------------------------------------------------------
# Julia / MicroMagnetic.jl job settings.
#
# The mesh below resolves a small representative sub-volume, NOT a whole 20 um
# particle.  A 5 nm mesh over 20 um would require 4000^3 cells.  Using it for a
# full particle and claiming quantitative accuracy is explicitly forbidden by
# the project plan.
# ---------------------------------------------------------------------------
package: "MicroMagnetic.jl"
mode: "auto"                 # auto -> try Julia, fall back to the documented reduced-order model
julia_executable: "julia"
timeout_s: 3600
particle_shape: "box"
mesh_nx: 64
mesh_ny: 16
mesh_nz: 16
dx_m: 5.0e-9
dy_m: 5.0e-9
dz_m: 5.0e-9
n_cluster_particles: 7
Ms_A_m: null                 # null -> take material.Ms_A_m
exchange_A_J_m: null         # null -> take material.exchange_A_J_m
anisotropy_K_J_m3: null      # null -> take material.anisotropy_K_J_m3
damping_alpha: null          # null -> take material.damping_alpha
demag: true
m0: [-1.0, 0.0, 0.0]
stopping_dmdt: 0.01
hmax_A_m: 4.0e5
n_field_steps: 41
sweep: "full_loop"
fallback_model: "tanh_major_loop"
loop_initial: null
output_subdir: "hysteresis"
notes: "Run julia/setup.jl once to install MicroMagnetic.jl and pin versions."
